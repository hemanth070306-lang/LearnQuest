<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LearnQuest - Level 1 Quiz</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #141e30,
                    #243b55
                );

            color: white;

        }

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 20px 40px;

            background: rgba(0,0,0,0.25);

        }

        .logo {

            font-size: 26px;

            font-weight: bold;

        }

        .back-btn {

            border: none;

            padding: 10px 18px;

            border-radius: 10px;

            background: #ff4757;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }

        .container {

            width: 90%;

            max-width: 800px;

            margin: auto;

            padding: 50px 0;

            text-align: center;

        }

        .badge {

            display: inline-block;

            background: #ffd32a;

            color: #222;

            padding: 10px 20px;

            border-radius: 30px;

            font-weight: bold;

            margin-bottom: 20px;

        }

        h1 {

            font-size: 38px;

            margin-bottom: 10px;

        }

        .subtitle {

            color: #ccc;

            margin-bottom: 35px;

        }

        .quiz-card {

            background: white;

            color: #222;

            padding: 35px;

            border-radius: 20px;

            text-align: left;

        }

        .question-number {

            color: #6c5ce7;

            font-weight: bold;

            margin-bottom: 15px;

        }

        .question {

            font-size: 24px;

            font-weight: bold;

            margin-bottom: 25px;

        }

        .option {

            display: block;

            width: 100%;

            padding: 15px;

            margin-bottom: 12px;

            border: 2px solid #ddd;

            border-radius: 12px;

            background: white;

            text-align: left;

            font-size: 16px;

            cursor: pointer;

            transition: 0.2s;

        }

        .option:hover {

            border-color: #6c5ce7;

            background: #f4f2ff;

        }

        .option.selected {

            border-color: #6c5ce7;

            background: #eeeaff;

        }

        .submit-btn {

            width: 100%;

            margin-top: 20px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #6c5ce7;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

        }

        .result {

            display: none;

            margin-top: 25px;

            padding: 25px;

            border-radius: 15px;

            background: #f1f2f6;

            text-align: center;

        }

        .result h2 {

            margin-bottom: 10px;

        }

        .xp {

            color: #e1a900;

            font-size: 22px;

            font-weight: bold;

            margin: 15px 0;

        }

        .next-btn {

            border: none;

            padding: 14px 25px;

            border-radius: 10px;

            background: #20bf6b;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }

    </style>

</head>

<body>


    <div class="header">

        <div class="logo">
            🎮 LearnQuest
        </div>

        <button
            class="back-btn"
            onclick="goBack()">

            ← Variables Village

        </button>

    </div>


    <div class="container">

        <div class="badge">
            LEVEL 1 QUIZ
        </div>

        <h1>
            🎯 Knowledge Challenge
        </h1>

        <p class="subtitle">
            Test what you learned about Python Variables
        </p>


        <div class="quiz-card">

            <div class="question-number">
                Question 1 of 1
            </div>

            <div class="question">

                Which symbol is used to assign a value
                to a variable in Python?

            </div>


            <button
                class="option"
                onclick="selectOption(this, 'A')">

                A. ==

            </button>


            <button
                class="option"
                onclick="selectOption(this, 'B')">

                B. =

            </button>


            <button
                class="option"
                onclick="selectOption(this, 'C')">

                C. !=

            </button>


            <button
                class="option"
                onclick="selectOption(this, 'D')">

                D. ===

            </button>


            <button
                class="submit-btn"
                onclick="submitQuiz()">

                Submit Answer 🚀

            </button>


            <div
                class="result"
                id="result">

                <h2 id="resultTitle"></h2>

                <p id="resultMessage"></p>

                <div
                    class="xp"
                    id="xpReward">
                </div>

                <button
                    class="next-btn"
                    onclick="completeLevel()">

                    🏆 Complete Level

                </button>

            </div>

        </div>

    </div>


    <script>

        let selectedAnswer = null;

        function selectOption(button, answer) {

            const options =
                document.querySelectorAll(".option");

            options.forEach(function(option) {

                option.classList.remove("selected");

            });

            button.classList.add("selected");

            selectedAnswer = answer;

        }


        function submitQuiz() {

            if (!selectedAnswer) {

                alert("Please select an answer first.");

                return;

            }

            const result =
                document.getElementById("result");

            const title =
                document.getElementById("resultTitle");

            const message =
                document.getElementById("resultMessage");

            const xp =
                document.getElementById("xpReward");


            result.style.display = "block";


            if (selectedAnswer === "B") {

                title.textContent =
                    "🎉 Excellent!";

                message.textContent =
                    "You selected the correct answer.";

                xp.textContent =
                    "⭐ +30 XP";

            } else {

                title.textContent =
                    "💡 Almost there!";

                message.textContent =
                    "The correct answer is the assignment operator.";

                xp.textContent =
                    "⭐ Try again and improve!";

            }

        }


        async function completeLevel() {

            try {

                const response =
                    await fetch(
                        "https://learnquest-h5hb.onrender.com/complete-level",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "include",

                            body: JSON.stringify({
                                level: 1
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(data.message);

                    return;

                }


                alert(
                    "🎉 Level 1 Completed!\n\n" +
                    "⭐ +" +
                    data.reward.xp +
                    " XP\n" +
                    "🪙 +" +
                    data.reward.coins +
                    " Coins"
                );


                window.location.href =
                    "world.html";

            }

            catch (error) {

                console.error(error);

                alert(
                    "Cannot connect to LearnQuest server."
                );

            }

        }


        function goBack() {

            window.location.href =
                "level.html";

        }

    </script>


</body>

</html>
